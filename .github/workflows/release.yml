name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: UNIVERSAL=1 ./build.sh
      - name: Package
        run: ditto -c -k --keepParent noTunesRevived.app noTunesRevived.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: noTunesRevived
          path: noTunesRevived.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: noTunesRevived.zip
          generate_release_notes: true
